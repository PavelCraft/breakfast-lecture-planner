{% load static i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% if seo_public %}
      <meta name="description" content="{{ seo_description }}">
      <link rel="canonical" href="{{ seo_canonical }}">
    {% else %}
      <meta name="robots" content="noindex, follow">
    {% endif %}
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />


    <link rel="stylesheet" href="{% static 'css/new_style.css' %}" />
    <link rel="stylesheet" href="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/theme/ckeditor.css">
    <title>{% block title %}{{ seo_title }}{% endblock title %}</title>
    <link rel="apple-touch-icon"
          sizes="57x57"
          href="{% static 'icons/apple-icon-57x57.png' %}">
    <link rel="apple-touch-icon"
          sizes="60x60"
          href="{% static 'icons/apple-icon-60x60.png' %}">
    <link rel="apple-touch-icon"
          sizes="72x72"
          href="{% static 'icons/apple-icon-72x72.png' %}">
    <link rel="apple-touch-icon"
          sizes="76x76"
          href="{% static 'icons/apple-icon-76x76.png' %}">
    <link rel="apple-touch-icon"
          sizes="114x114"
          href="{% static 'icons/apple-icon-114x114.png' %}">
    <link rel="apple-touch-icon"
          sizes="120x120"
          href="{% static 'icons/apple-icon-120x120.png' %}">
    <link rel="apple-touch-icon"
          sizes="144x144"
          href="{% static 'icons/apple-icon-144x144.png' %}">
    <link rel="apple-touch-icon"
          sizes="152x152"
          href="{% static 'icons/apple-icon-152x152.png' %}">
    <link rel="apple-touch-icon"
          sizes="180x180"
          href="{% static 'icons/apple-icon-180x180.png' %}">
    <link rel="icon"
          type="image/png"
          sizes="192x192"
          href="{% static 'icons/android-icon-192x192.png' %}">
    <link rel="icon"
          type="image/png"
          sizes="32x32"
          href="{% static 'icons/favicon-32x32.png' %}">
    <link rel="icon"
          type="image/png"
          sizes="96x96"
          href="{% static 'icons/favicon-96x96.png' %}">
    <link rel="icon"
          type="image/png"
          sizes="16x16"
          href="{% static 'icons/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'icons/manifest.json' %}">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="/ms-icon-144x144.png">
    <meta name="theme-color" content="#ffffff">
  </head>
  <body>
    {% block content %}
    {% endblock content %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/new_script.js' %}"></script>
  </body>
</html>
